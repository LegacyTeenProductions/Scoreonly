<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standalone Runs Tracker</title>
    <style>
        /* --- CORE STANDALONE IPAD OPTIMIZATIONS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        /* --- 1. THE SCOREBUG VISUAL BOX --- */
        .scorebug-display {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .team-line {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #bugAway { color: #ff4d4d; }
        #bugHome { color: #3399ff; }

        .run-digit {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 32px;
            color: #ffcc00;
            background-color: #000;
            padding: 2px 12px;
            border-radius: 6px;
            border: 1px solid #2d2d2d;
            min-width: 55px;
            text-align: center;
        }


        /* --- 2. THE CONTROL PANEL CONTAINER --- */
        .control-panel {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
        }

        .panel-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .panel-section h3 {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        /* Name Inputs */
        input {
            width: 100%;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            -webkit-user-select: text;
            user-select: text;
        }

        /* Large Touch Buttons Grid */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            background: #3e3e3e;
            color: white;
            border: none;
            padding: 18px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 0 #1a1a1a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a1a1a;
        }

        button.plus-run { background: #2e7d32; box-shadow: 0 4px 0 #1b5e20; }
        button.plus-run:active { box-shadow: 0 2px 0 #1b5e20; }
        button.sub-btn { background: #c62828; box-shadow: 0 4px 0 #8e1c1c; padding: 12px 10px; font-size: 14px;}
        button.sub-btn:active { box-shadow: 0 2px 0 #8e1c1c; }
    </style>
</head>
<body>

    <!-- 1. THE SCOREBUG VISUAL BOX -->
    <div class="scorebug-display">
        <div class="team-line" style="color: #ff4d4d;">
            <span>AWAY: <span id="bugAway">TEAM A</span></span>
            <span class="run-digit" id="dispAwayRuns">0</span>
        </div>
        <div class="team-line" style="color: #3399ff;">
            <span>HOME: <span id="bugHome">TEAM B</span></span>
            <span class="run-digit" id="dispHomeRuns">0</span>
        </div>
    </div>

    <!-- 2. THE CONTROL PANEL -->
    <div class="control-panel">
        
        <!-- Section: Team Names -->
        <div class="panel-section">
            <h3>Team Names</h3>
            <input type="text" id="inputAway" value="TEAM A" oninput="updateNames()" placeholder="Away Name...">
            <input type="text" id="inputHome" value="TEAM B" oninput="updateNames()" placeholder="Home Name...">
        </div>

        <!-- Section: Away Runs -->
        <div class="panel-section">
            <h3 style="color: #ff4d4d;">Away Team Runs</h3>
            <div class="btn-row">
                <button class="plus-run" onclick="adjustRuns('awayRuns', 1)">+1 Run</button>
                <button class="sub-btn" onclick="adjustRuns('awayRuns', -1)">-1 Run</button>
            </div>
        </div>

        <!-- Section: Home Runs -->
        <div class="panel-section">
            <h3 style="color: #3399ff;">Home Team Runs</h3>
            <div class="btn-row">
                <button class="plus-run" onclick="adjustRuns('homeRuns', 1)">+1 Run</button>
                <button class="sub-btn" onclick="adjustRuns('homeRuns', -1)">-1 Run</button>
            </div>
        </div>

    </div>

    <!-- 3. THE SCRIPT ENGINE -->
    <script>
        // Separate Data Model tracking only runs
        let scoreState = {
            awayRuns: 0,
            homeRuns: 0
        };

        // Standard team name sync
        function updateNames() {
            const awayVal = document.getElementById('inputAway').value;
            const homeVal = document.getElementById('inputHome').value;
            document.getElementById('bugAway').innerText = awayVal || 'AWAY';
            document.getElementById('bugHome').innerText = homeVal || 'HOME';
        }

        // Dedicated runs adjusting function
        function adjustRuns(field, value) {
            scoreState[field] = Math.max(0, scoreState[field] + value);
            renderDisplay();
        }

        // Pushes property data into view
        function renderDisplay() {
            document.getElementById('dispAwayRuns').innerText = scoreState.awayRuns;
            document.getElementById('dispHomeRuns').innerText = scoreState.homeRuns;
        }

        // Initial launch pass
        renderDisplay();
    </script>

</body>
</html>
