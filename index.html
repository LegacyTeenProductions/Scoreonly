<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Massive Square Scorebug & Controller Overlay</title>
<style>
/* Base Viewport Canvas - Centers the layout panels */
html, body {
background-color: #1a1a1a;
margin: 0; padding: 0;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
font-weight: 800; color: #ffffff;
user-select: none; 
width: 100vw; 
height: 100vh; 
overflow: hidden;
display: flex;
align-items: center;
justify-content: space-around;
box-sizing: border-box;
}

*, *:before, *:after {
box-sizing: border-box;
}

/* Massive Square Container Box - Normalized Layout Math */
.scorebug-container {
display: flex;
flex-direction: column; 
background-color: #0b0c10;
border-radius: 4vh;
box-shadow: 0 4vh 10vh rgba(0,0,0,0.8);
width: 90vh; 
height: 90vh; 
overflow: hidden;
border: 1.5vh solid #1f2833;
}

/* Team Row Element Layouts */
.team-row {
display: flex;
align-items: center;
justify-content: space-between;
height: 27.5vh; 
border-bottom: 1vh solid #2d323f;
}
.team-title {
padding: 0 6vh;
font-size: 11vh; 
letter-spacing: 0.5vh;
height: 100%;
display: flex;
align-items: center;
flex-grow: 1;
font-weight: 900;
text-shadow: 0 0.5vh 1vh rgba(0,0,0,0.5);
}
.away-team .team-title { background-color: #FFD700; color: #000000; } 
.home-team .team-title { background-color: #FF0000; color: #ffffff; } 

.score-val {
background-color: #1f232b;
font-size: 14vh; 
width: 28vh;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
border-left: 1vh solid #2d323f;
}

/* Bottom Game Stats Data Bar */
.status-row {
display: flex;
align-items: center;
height: 32vh;
background-color: #151922;
}

.data-segment {
display: flex;
align-items: center;
justify-content: center;
height: 100%;
flex: 1;
}
.data-segment:not(:last-child) {
border-right: 1vh solid #2d323f;
}

/* Inning layouts */
.arrow-indicator { font-size: 7vh; margin-right: 1.5vh; color: #fca311; line-height: 1; }
.inning-num { font-size: 11vh; font-weight: 900; line-height: 1; }

/* Diamond Runners Mapping */
.diamond-wrap { position: relative; width: 14vh; height: 14vh; transform: rotate(45deg); }
.base-pad { position: absolute; width: 5.5vh; height: 5.5vh; background-color: #454d5a; border: 0.8vh solid #151922; border-radius: 0.5vh; }
.base-pad.b-1 { top: 0; right: 0; }
.base-pad.b-2 { top: 0; left: 0; }
.base-pad.b-3 { bottom: 0; left: 0; }
.base-pad.occupied { background-color: #fca311; box-shadow: 0 0 4vh #fca311; }

/* BSO Count Tracking Matrix Layout */
.matrix-column { display: flex; flex-direction: column; gap: 1.5vh; font-size: 3.5vh; color: #8d99ae; }
.matrix-row { display: flex; align-items: center; }
.row-header { width: 4vh; font-size: 4vh; font-weight: bold; text-align: center; }
.dot-grid { display: flex; gap: 1.5vh; margin-left: 2vh; }
.indicator-dot { width: 3.5vh; height: 3.5vh; border-radius: 50%; background-color: #3d4554; }
.indicator-dot.b-active { background-color: #00f5d4; }
.indicator-dot.s-active { background-color: #ff5400; }
.indicator-dot.o-active { background-color: #fca311; }

/* Controller Sidebar Configuration Panel */
.controller-panel {
width: 45vw;
height: 90vh;
background-color: #112233;
border: 1vh solid #1f2833;
border-radius: 4vh;
padding: 4vh;
display: flex;
flex-direction: column;
justify-content: space-between;
box-shadow: 0 4vh 10vh rgba(0,0,0,0.8);
}
.ctrl-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2vh;
}
.ctrl-label {
font-size: 3.5vh;
color: #00f5d4;
}
.ctrl-group {
display: flex;
gap: 1.5vh;
}
input[type="text"] {
background-color: #1f232b;
border: 0.5vh solid #454d5a;
color: #fff;
font-size: 3.5vh;
padding: 1vh;
width: 25vh;
border-radius: 1vh;
text-align: center;
font-weight: bold;
}
button {
background-color: #454d5a;
border: none;
color: white;
font-size: 4vh;
font-weight: bold;
padding: 1vh 3vh;
border-radius: 1vh;
cursor: pointer;
min-width: 8vh;
}
button:active {
background-color: #00f5d4;
color: #000;
}
.btn-active {
background-color: #fca311;
color: #000;
}
</style>
</head>
<body>

<!-- Left Panel: Target Scorebug Output View -->
<div class="scorebug-container">
    <div class="team-row away-team">
        <div class="team-title" id="disp-away-name">AWY</div>
        <div class="score-val" id="disp-away-score">0</div>
    </div>
    <div class="team-row home-team">
        <div class="team-title" id="disp-home-name">HOM</div>
        <div class="score-val" id="disp-home-score">0</div>
    </div>
    <div class="status-row">
        <div class="data-segment">
            <span class="arrow-indicator" id="disp-inning-arrow">▲</span>
            <span class="inning-num" id="disp-inning-num">1</span>
        </div>
        <div class="data-segment">
            <div class="diamond-wrap">
                <div class="base-pad b-2" id="disp-base-2"></div>
                <div class="base-pad b-1" id="disp-base-1"></div>
                <div class="base-pad b-3" id="disp-base-3"></div>
            </div>
        </div>
        <div class="data-segment">
            <div class="matrix-column">
                <div class="matrix-row">
                    <span class="row-header">B</span>
                    <div class="dot-grid"><div class="indicator-dot" id="dot-b1"></div><div class="indicator-dot" id="dot-b2"></div><div class="indicator-dot" id="dot-b3"></div></div>
                </div>
                <div class="matrix-row">
                    <span class="row-header">S</span>
                    <div class="dot-grid"><div class="indicator-dot" id="dot-s1"></div><div class="indicator-dot" id="dot-s2"></div></div>
                </div>
                <div class="matrix-row">
                    <span class="row-header">O</span>
                    <div class="dot-grid"><div class="indicator-dot" id="dot-o1"></div><div class="indicator-dot" id="dot-o2"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Right Panel: State Engine Controller Layout -->
<div class="controller-panel">
    <div class="ctrl-row">
        <span class="ctrl-label">Away Team Name</span>
        <input type="text" id="ctrl-away-name" value="AWY" maxlength="3">
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Away Score</span>
        <div class="ctrl-group">
            <button id="btn-away-minus">-</button>
            <button id="btn-away-plus">+</button>
        </div>
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Home Team Name</span>
        <input type="text" id="ctrl-home-name" value="HOM" maxlength="3">
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Home Score</span>
        <div class="ctrl-group">
            <button id="btn-home-minus">-</button>
            <button id="btn-home-plus">+</button>
        </div>
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Inning Frame</span>
        <div class="ctrl-group">
            <button id="btn-top" class="btn-active">Top ▲</button>
            <button id="btn-bot">Bot ▼</button>
        </div>
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Inning Number</span>
        <div class="ctrl-group">
            <button id="btn-inn-minus">-</button>
            <button id="btn-inn-plus">+</button>
        </div>
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Count Tracking</span>
        <div class="ctrl-group">
            <button id="btn-count-b">+Ball</button>
            <button id="btn-count-s">+Strike</button>
            <button id="btn-count-o">+Out</button>
            <button id="btn-count-reset" style="background-color: #bd1f36;">Reset</button>
        </div>
    </div>
    <div class="ctrl-row">
        <span class="ctrl-label">Base Runners</span>
        <div class="ctrl-group">
            <button id="btn-runner-1">1st</button>
            <button id="btn-runner-2">2nd</button>
            <button id="btn-runner-3">3rd</button>
        </div>
    </div>
</div>

<!-- COMPACT ENGINE LOGIC ARCHITECTURE -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    // State Management Core Engine
    const state = {
        awayName: 'AWY',
        homeName: 'HOM',
        away: 0,
        home: 0,
        inning: 1,
        isTop: true,
        b: 0,
        s: 0,
        o: 0,
        runners: { 1: false, 2: false, 3: false }
    };

    // Element Cache Layer
    const dom = {
        awayName: document.getElementById('disp-away-name'),
        homeName: document.getElementById('disp-home-name'),
        awayScore: document.getElementById('disp-away-score'),
        homeScore: document.getElementById('disp-home-score'),
        inningNum: document.getElementById('disp-inning-num'),
        inningArrow: document.getElementById('disp-inning-arrow'),
        inputAway: document.getElementById('ctrl-away-name'),
        inputHome: document.getElementById('ctrl-home-name'),
        btnTop: document.getElementById('btn-top'),
        btnBot: document.getElementById('btn-bot'),
        runnerBtns: {
            1: document.getElementById('btn-runner-1'),
            2: document.getElementById('btn-runner-2'),
            3: document.getElementById('btn-runner-3')
        }
    };

    // Event Listener Implementation Structure
    dom.inputAway.addEventListener('input', (e) => { state.awayName = e.target.value.toUpperCase(); render(); });
    dom.inputHome.addEventListener('input', (e) => { state.homeName = e.target.value.toUpperCase(); render(); });

    document.getElementById('btn-away-minus').addEventListener('click', () => modScore('away', -1));
    document.getElementById('btn-away-plus').addEventListener('click', () => modScore('away', 1));
    document.getElementById('btn-home-minus').addEventListener('click', () => modScore('home', -1));
